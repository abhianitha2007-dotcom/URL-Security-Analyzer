<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Security Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>🔒 URL Security Analyzer</h1>

    <p>Analyze a website URL for phishing indicators.</p>

    <form action="/analyze" method="POST">

        <input
            type="text"
            name="url"
            placeholder="Enter a URL (example: google.com)"
            required
        >

        <br><br>

        <button type="submit">
            Analyze URL
        </button>

    </form>

</div>

</body>
</html>
