<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Security Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 500px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        ul {
            text-align: left;
            display: inline-block;
            margin-bottom: 30px;
            font-size: 18px;
        }

        li {
            margin: 10px 0;
        }

        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>URL Security Analyzer</h1>

    <p>Analyze a website URL for phishing indicators.</p>

    <form action="/analyze" method="POST">
    <input type="text" name="url" placeholder="Enter a URL">
    <button type="submit">Analyze URL</button>
</form>

</div>
